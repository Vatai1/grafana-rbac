name: grafana-rbac

services:
  grafana:
    image: vatai12/grafana-rbac:dev
    build: .   # ./build.sh dev builds the binary + frontend and restarts this stack
    ports: ["3001:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      GF_DATABASE_PASSWORD: ${GF_DB_PASSWORD:-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_CLOUD_MIGRATION_ENABLED: "false"   # hides "Migrate to Grafana Cloud"
      GF_NEWS_NEWS_FEED_ENABLED: "false"    # hides the grafana.com news feed (Cloud ads) on Home
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/access-control:/etc/grafana/provisioning/access-control:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grafana
      POSTGRES_USER: grafana
      POSTGRES_PASSWORD: ${GF_DB_PASSWORD:-grafana}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafana -d grafana"]
      interval: 5s
      retries: 20
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  grafana-data:
  pg-data:
